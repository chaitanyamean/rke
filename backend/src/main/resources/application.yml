server:
  port: 8080

spring:
  application:
    name: rke-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rke}
    username: ${DB_USERNAME:rke}
    password: ${DB_PASSWORD:rke}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations, not Hibernate auto-DDL.
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: info
