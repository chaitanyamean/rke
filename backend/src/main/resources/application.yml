server:
  port: 8080

# Active profile controls whether simulation endpoints are registered.
# Override via -Dspring.profiles.active=prod (or SPRING_PROFILES_ACTIVE=prod env var)
# to disable all simulation endpoints.
# Default is 'dev' so the app works out-of-the-box locally.
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: rke-backend

  datasource:
    # DATABASE_URL takes full precedence (Docker Compose sets it as a JDBC URL).
    # On Render, individual DB_* vars are injected via fromDatabase; the JDBC URL
    # is assembled from them. DB_HOST/PORT/NAME are ignored when DATABASE_URL is set.
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rke}}
    username: ${DB_USERNAME:rke}
    password: ${DB_PASSWORD:rke}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

storage:
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:rke-assets}
    public-url-base: ${S3_PUBLIC_URL_BASE:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:5173}

logging:
  level:
    org.flywaydb: info
    com.rke.backend.simulation: info

# ----------------------------------------------------------------------------
# Incident simulation framework — dev/test only.
# These properties are consumed by ConfigRegressionScenario.
# The known-good default is max-items-per-order: 50.
# To activate the INC-004 regression, set max-items-per-order: 0
# (either here or in application-simulation.yml, which is committed as the
# "bad configuration" state for RCA agent correlation).
# ----------------------------------------------------------------------------
simulation:
  config-regression:
    max-items-per-order: ${SIMULATION_MAX_ITEMS_PER_ORDER:50}
