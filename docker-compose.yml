services:
  postgres:
    image: postgres:16-alpine
    container_name: rke-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rke}
      POSTGRES_USER: ${DB_USERNAME:-rke}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rke}
    ports:
      # Host 5433 -> container 5432 (avoids clashing with a local postgres on 5432)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rke} -d ${POSTGRES_DB:-rke}"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    container_name: rke-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  backend:
    build:
      context: ./backend
    container_name: rke-backend
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rke}
      DB_USERNAME: ${DB_USERNAME:-rke}
      DB_PASSWORD: ${DB_PASSWORD:-rke}
      # ---- OpenTelemetry (read natively by the Java agent) ----
      OTEL_SERVICE_NAME: rk-enterprises-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      # ---- S3 storage (logo uploads) — override via .env ----
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-rke-assets}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-}
      # ---- CORS ----
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
    ports:
      - "8000:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the static bundle; the browser reaches the backend on the host port.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: rke-frontend
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  postgres_data:
