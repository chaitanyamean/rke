services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: rke-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rke}
      POSTGRES_USER: ${DB_USERNAME:-rke}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rke}
    ports:
      # Host 5433 → container 5432 (avoids clashing with a local Postgres on 5432)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rke} -d ${POSTGRES_DB:-rke}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Jaeger all-in-one (v1)
  #
  # Receives OTLP traces from the OTEL Collector via gRPC (port 4317 internal).
  # The Jaeger UI is available at http://localhost:16686.
  #
  # Trace storage: in-memory (badger) — traces are lost on container restart.
  # This is intentional for local development; no data persistence is needed.
  #
  # Port map:
  #   4317  OTLP/gRPC receiver  — used by the OTEL Collector (internal only)
  #   16686 Jaeger UI + HTTP API — exposed to the host for browser access
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: rke-jaeger
    environment:
      # Enable the OTLP gRPC receiver (introduced in Jaeger v1.35).
      COLLECTOR_OTLP_ENABLED: "true"
      # Set the log level to reduce noise in local development.
      LOG_LEVEL: info
    ports:
      - "16686:16686"  # Jaeger UI + query HTTP API
      # Port 4317 (OTLP/gRPC) is intentionally NOT published to the host —
      # only the OTEL Collector (within the Docker network) needs to reach it.
      # This prevents accidental direct RKE → Jaeger connections that bypass
      # the collector.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector
  #
  # Receives OTLP telemetry (gRPC 4317, HTTP 4318) from the RKE backend and
  # fans out traces to:
  #   - debug exporter   (collector stdout — always active)
  #   - otlp/jaeger      (Jaeger all-in-one — Phase 4)
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    container_name: rke-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC   — primary ingest from RKE
      - "4318:4318"    # OTLP HTTP   — secondary / curl-based testing
      - "13133:13133"  # health_check extension (GET /health)
      - "55679:55679"  # zpages debug UI (http://localhost:55679/debug/tracez)
      - "8888:8888"    # Collector self-metrics (Prometheus format /metrics)
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # RKE Spring Boot backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    container_name: rke-backend
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      # ---- Database ----
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rke}
      DB_USERNAME: ${DB_USERNAME:-rke}
      DB_PASSWORD: ${DB_PASSWORD:-rke}

      # ---- OpenTelemetry ----
      # Endpoint read by OpenTelemetryConfig (management.otlp.tracing.endpoint).
      # Traces go to the OTEL Collector, which fans out to Jaeger and debug.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: rke-backend
      DEPLOYMENT_ENVIRONMENT: development
      OTEL_SAMPLING_PROBABILITY: "1.0"

      # ---- S3 storage (logo uploads) — override via .env ----
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-rke-assets}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-}

      # ---- CORS ----
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
    ports:
      - "8000:8080"

  # ---------------------------------------------------------------------------
  # RKE React frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: rke-frontend
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  postgres_data:
