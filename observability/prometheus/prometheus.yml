global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Self-monitor Prometheus.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # The OTel Collector's prometheus exporter exposes all OTLP metrics that
  # arrived from the backend JVM (HTTP server, JVM GC, thread pools, etc.)
  # on a pull endpoint. No remote-write push needed — Prometheus scrapes here.
  - job_name: otel-collector
    scrape_interval: 10s
    static_configs:
      - targets: ['otel-collector:8889']
