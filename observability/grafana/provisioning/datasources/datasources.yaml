apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    jsonData:
      httpMethod: POST
      # Let Grafana compute rate/increase intervals automatically.
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      # Wire Loki → Tempo so a trace_id field in a log line becomes a clickable link.
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    access: proxy
    jsonData:
      # Show traces alongside Loki logs (trace → logs correlation).
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        customQuery: false
      # Show service-map tab in Explore (requires Prometheus).
      serviceMap:
        datasourceUid: prometheus
      # Enable TraceQL search.
      search:
        hide: false
      nodeGraph:
        enabled: true
