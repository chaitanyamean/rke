# Minimal single-binary Tempo configuration for local development.
# Accepts OTLP from the OTel Collector on its default ports (4317/4318).
# Trace blocks are stored on the local filesystem (named volume).
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h   # keep 7 days of trace data locally

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
