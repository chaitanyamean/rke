# =============================================================================
# OpenTelemetry Collector — RKE local development configuration
#
# Phase 3: receives OTLP telemetry from the RKE Spring Boot backend.
# Phase 4 will add Jaeger as the trace backend by uncommenting the
# otlp/jaeger exporter block and referencing it in the traces pipeline.
#
# Architecture:
#
#   RKE Spring Boot
#       │ OTLP/gRPC  (port 4317)
#       │ OTLP/HTTP  (port 4318)
#       ▼
#   OTEL Collector  (this config)
#       │
#       ├── debug exporter   → collector stdout (always active)
#       └── [Phase 4] otlp/jaeger → Jaeger
# =============================================================================

# -----------------------------------------------------------------------------
# Extensions
# Lightweight utilities that enhance the collector itself.
# -----------------------------------------------------------------------------
extensions:

  # health_check: exposes GET /health on port 13133.
  # Used by Docker's HEALTHCHECK and curl-based readiness probes.
  health_check:
    endpoint: 0.0.0.0:13133

  # zpages: HTTP debugging UI on port 55679.
  # Browse http://localhost:55679/debug/tracez  to inspect live trace samples.
  # Browse http://localhost:55679/debug/pipelinez to inspect pipeline health.
  zpages:
    endpoint: 0.0.0.0:55679

# -----------------------------------------------------------------------------
# Receivers
# Accept telemetry over OTLP from the RKE backend.
# -----------------------------------------------------------------------------
receivers:

  otlp:
    protocols:
      # gRPC — primary protocol used by RKE (OTEL_EXPORTER_OTLP_ENDPOINT).
      grpc:
        endpoint: 0.0.0.0:4317
      # HTTP/protobuf — secondary protocol; useful for browser-based or
      # HTTP-only clients and for testing with curl.
      http:
        endpoint: 0.0.0.0:4318

# -----------------------------------------------------------------------------
# Processors
# Transform or filter telemetry before export.
# Keep this minimal — add processors only when there is a clear reason.
# -----------------------------------------------------------------------------
processors:

  # memory_limiter: protects the collector process from OOM under burst load.
  # Must be the first processor in every pipeline.
  memory_limiter:
    check_interval: 5s
    # Hard limit: collector drops telemetry above this RSS.
    limit_mib: 256
    # Soft limit: collector starts applying backpressure at 80 % of the hard limit.
    spike_limit_mib: 64

  # batch: groups spans into batches before export.
  # Reduces outbound connections and improves throughput.
  batch:
    # Maximum wait time before flushing a partial batch.
    timeout: 5s
    # Maximum number of spans per batch.
    send_batch_size: 512

  # resource: adds or overrides resource attributes on every span/metric/log.
  # Used to stamp the telemetry.environment tag so traces are filterable by env.
  resource:
    attributes:
      - key: telemetry.environment
        value: development
        action: upsert

# -----------------------------------------------------------------------------
# Exporters
# Send processed telemetry downstream.
# -----------------------------------------------------------------------------
exporters:

  # debug: prints telemetry to the collector's stdout.
  # Set verbosity: basic for one-line summaries, detailed for full span data.
  # Change to 'normal' or 'basic' in high-traffic environments to reduce noise.
  debug:
    verbosity: detailed

  # ---- Phase 4: Jaeger exporter (uncomment when Jaeger is added) -----------
  # otlp/jaeger:
  #   endpoint: jaeger:4317          # Jaeger OTLP/gRPC receiver port
  #   tls:
  #     insecure: true               # OK for local development over Docker network
  # -------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Service
# Wires receivers → processors → exporters into named pipelines.
# Each signal (traces / metrics / logs) has its own pipeline.
# -----------------------------------------------------------------------------
service:

  # Extensions must be listed here to be activated.
  extensions: [health_check, zpages]

  pipelines:

    # Traces pipeline — the primary signal for Phase 3.
    traces:
      receivers:  [otlp]
      # memory_limiter must come before batch.
      processors: [memory_limiter, batch, resource]
      exporters:  [debug]
      # Phase 4: add otlp/jaeger to exporters → [debug, otlp/jaeger]

    # Metrics pipeline — receives metrics from the RKE actuator/micrometer.
    # Currently exported to debug only; extend in a later phase if needed.
    metrics:
      receivers:  [otlp]
      processors: [memory_limiter, batch, resource]
      exporters:  [debug]

    # Logs pipeline — receives structured logs forwarded via OTLP.
    # RKE writes to stdout (JSON); this pipeline is here for completeness.
    logs:
      receivers:  [otlp]
      processors: [memory_limiter, batch, resource]
      exporters:  [debug]

  # Collector-internal telemetry (its own logs/metrics).
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888   # Prometheus-format self-metrics on /metrics
