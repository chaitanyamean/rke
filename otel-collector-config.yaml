# =============================================================================
# OpenTelemetry Collector — RKE local development configuration
#
# Phase 4: receives OTLP telemetry from RKE and exports traces to:
#   - debug exporter  (collector stdout, always active)
#   - otlp/jaeger     (Jaeger all-in-one, local UI at http://localhost:16686)
#
# Architecture:
#
#   RKE Spring Boot
#       │ OTLP/gRPC  (port 4317)
#       │ OTLP/HTTP  (port 4318)
#       ▼
#   OTEL Collector  (this config)
#       │
#       ├── debug exporter   → collector stdout (always on)
#       └── otlp/jaeger      → Jaeger all-in-one → Jaeger UI :16686
# =============================================================================

# -----------------------------------------------------------------------------
# Extensions
# -----------------------------------------------------------------------------
extensions:

  # health_check: GET /health on port 13133 — used by Docker healthcheck.
  health_check:
    endpoint: 0.0.0.0:13133

  # zpages: browser-based pipeline and trace inspector on port 55679.
  # http://localhost:55679/debug/tracez   — live trace samples
  # http://localhost:55679/debug/pipelinez — pipeline health
  zpages:
    endpoint: 0.0.0.0:55679

# -----------------------------------------------------------------------------
# Receivers
# Accept OTLP telemetry from the RKE backend.
# -----------------------------------------------------------------------------
receivers:

  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317   # primary — used by RKE
      http:
        endpoint: 0.0.0.0:4318   # secondary — curl / HTTP-only clients

# -----------------------------------------------------------------------------
# Processors
# Keep this minimal. Order matters: memory_limiter must always be first.
# -----------------------------------------------------------------------------
processors:

  # memory_limiter: protect the collector from OOM under burst load.
  memory_limiter:
    check_interval: 5s
    limit_mib: 256       # hard limit — drop telemetry above this RSS
    spike_limit_mib: 64  # soft limit — backpressure at (limit - spike)

  # batch: group spans into batches before export for efficiency.
  batch:
    timeout: 5s
    send_batch_size: 512

  # resource: stamp a deployment tag on all telemetry signals.
  resource:
    attributes:
      - key: telemetry.environment
        value: development
        action: upsert

# -----------------------------------------------------------------------------
# Exporters
# -----------------------------------------------------------------------------
exporters:

  # debug: print full telemetry to collector stdout.
  # Useful for verifying what the collector receives without opening Jaeger.
  # Switch to verbosity: basic to reduce log volume in busy environments.
  debug:
    verbosity: detailed

  # otlp/jaeger: forward traces to Jaeger via OTLP/gRPC.
  # Jaeger's OTLP receiver listens on its internal port 4317 (not exposed to
  # the host — only reachable within the Docker Compose network).
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true   # no TLS needed on a private Docker bridge network

# -----------------------------------------------------------------------------
# Service
# Wires everything together.
# -----------------------------------------------------------------------------
service:

  extensions: [health_check, zpages]

  pipelines:

    # Traces: fan out to both debug (stdout) and Jaeger.
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, batch, resource]
      exporters:  [debug, otlp/jaeger]

    # Metrics: debug only for now.
    metrics:
      receivers:  [otlp]
      processors: [memory_limiter, batch, resource]
      exporters:  [debug]

    # Logs: debug only for now.
    logs:
      receivers:  [otlp]
      processors: [memory_limiter, batch, resource]
      exporters:  [debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888   # Prometheus self-metrics on /metrics
